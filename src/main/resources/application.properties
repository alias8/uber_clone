server.port=8080
# Virtual threads (Project Loom, Java 21) — Tomcat hands out a virtual thread per request instead
# of a platform thread, so blocking calls (PricingClient's gRPC stub, JPA, Redis, Kafka) park
# cheaply instead of tying up one of the fixed platform-thread pool's ~200 threads. No code
# changes needed since this project is plain blocking Spring MVC, not WebFlux — every blocking
# call site is already shaped the way virtual threads are meant to speed up.
spring.threads.virtual.enabled=true
# Postgres: primary (writes, and reads that can't be stale) and a read replica.
# See config/DataSourceConfig.kt. Locally there is no replica, so it defaults to the same DB.
app.datasource.primary.jdbc-url=${DATABASE_URL:jdbc:postgresql://localhost:5432/uber_clone}
app.datasource.primary.username=${DATABASE_USER:jameskirk}
app.datasource.primary.password=${DATABASE_PASSWORD:password}
app.datasource.primary.maximum-pool-size=10
# Fail fast when the pool is full: wait at most 1.5 s for a connection (Hikari default 30 s),
# then PoolExhaustedHandler returns 503 + Retry-After. See config/PoolExhaustedHandler.kt.
app.datasource.primary.connection-timeout=1500
# Kill any single query that runs over 5 s, so a runaway query can't hold its connection for
# minutes. Postgres raises SQLState 57014, which reaches the client as a 500 (not retried: a slow
# query retried is just more load). Flyway uses this pool too, so migrations get the same limit;
# fine for this repo's small migrations, but a big backfill would run as a separate migration
# job/role with its own timeout rather than raising this one.
app.datasource.primary.connection-init-sql=SET statement_timeout = '5s'
app.datasource.replica.jdbc-url=${DATABASE_REPLICA_URL:jdbc:postgresql://localhost:5432/uber_clone}
app.datasource.replica.username=${DATABASE_USER:jameskirk}
app.datasource.replica.password=${DATABASE_PASSWORD:password}
app.datasource.replica.maximum-pool-size=10
app.datasource.replica.connection-timeout=1500
app.datasource.replica.connection-init-sql=SET statement_timeout = '5s'
# After a user writes, their reads use the primary for this long. Must be well above normal lag.
app.datasource.read-your-writes-seconds=5
# Learning aid: watch transactions and routing for each request. Noisy, so off in production.
# JpaTransactionManager logs "Creating new transaction ... PROPAGATION_REQUIRED,readOnly",
# "Participating in existing transaction", "Initiating transaction commit" / "rollback".
# ReadWriteRoutingDataSource logs "Routing connection to PRIMARY/REPLICA" on each real connection.
logging.level.org.springframework.orm.jpa.JpaTransactionManager=DEBUG
logging.level.org.example.config.ReadWriteRoutingDataSource=DEBUG
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Cookie
cookie.secure=${COOKIE_SECURE:false}
# JWT
jwt.secret=${JWT_SECRET:change-me-to-a-long-random-secret-in-production}
jwt.expiration-ms=2592000000
# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=ride-dispatch-group
spring.kafka.consumer.auto-offset-reset=earliest
# Producer timeouts. Events are sent after commit, on the request thread (KafkaEventProducer).
# max.block.ms: how long send() itself may block the caller, waiting for topic metadata or buffer
#   space. Default 60 s, so a Kafka outage could hold a request for a minute. Now 2 s, then send()
#   throws; the DB change is already committed, so KafkaEventProducer logs a lost event and the
#   request still succeeds.
# request.timeout.ms: how long the background sender waits for one broker reply (default 30 s).
# delivery.timeout.ms: total time for a record after send() returns, retries included, before its
#   future fails (default 120 s). Must be >= linger.ms + request.timeout.ms or the producer won't start.
# A shorter delivery timeout drops events sooner in an outage: the existing no-outbox gap.
spring.kafka.producer.properties.max.block.ms=2000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
# Lettuce's default command timeout is 60 s. Redis answers in well under 1 ms, so 200 ms already
# means it's in trouble; fail the call instead of holding the request. Also applies to the
# bucket4j rate limiter's connection (RedisConfig builds it from the same client).
spring.data.redis.timeout=200ms
# Pricing service (gRPC)
pricing-service.host=${PRICING_SERVICE_HOST:localhost}
pricing-service.port=${PRICING_SERVICE_PORT:6565}
# Total budget for one fare quote, one retry included (PricingClient). Then 503 + Retry-After: 5.
pricing-service.budget-ms=800