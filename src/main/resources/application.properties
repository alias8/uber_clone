server.port=8080
# Virtual threads (Project Loom, Java 21) — Tomcat hands out a virtual thread per request instead
# of a platform thread, so blocking calls (PricingClient's gRPC stub, JPA, Redis, Kafka) park
# cheaply instead of tying up one of the fixed platform-thread pool's ~200 threads. No code
# changes needed since this project is plain blocking Spring MVC, not WebFlux — every blocking
# call site is already shaped the way virtual threads are meant to speed up.
spring.threads.virtual.enabled=true
# Postgres
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/uber_clone}
spring.datasource.username=${DATABASE_USER:jameskirk}
spring.datasource.password=${DATABASE_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Cookie
cookie.secure=${COOKIE_SECURE:false}
# JWT
jwt.secret=${JWT_SECRET:change-me-to-a-long-random-secret-in-production}
jwt.expiration-ms=2592000000
# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=ride-dispatch-group
spring.kafka.consumer.auto-offset-reset=earliest
# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
# Pricing service (gRPC)
pricing-service.host=${PRICING_SERVICE_HOST:localhost}
pricing-service.port=${PRICING_SERVICE_PORT:6565}