spring.main.web-application-type=none
# Postgres — read-only against the same DB uber_clone owns/migrates; see README for the tradeoff
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/uber_clone}
spring.datasource.username=${DATABASE_USER:jameskirk}
spring.datasource.password=${DATABASE_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# Redis — same instance/keys as uber_clone's driver geo-index and surge cache
spring.data.redis.host=localhost
spring.data.redis.port=6379
grpc.port=${GRPC_PORT:6565}
